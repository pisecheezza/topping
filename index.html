<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="drawer-label">
  <span class="drawer-tag"></span>
  <span class="drawer-range" id="drawerRange"></span>
</div>

<header class="masthead">
  <h1 id="siteName"></h1>
  <p id="siteTagline" class="tagline"></p>
</header>

<nav class="tabs">
  <button class="tab active" data-view="main">Main</button>
  <button class="tab" data-view="profile">Profile</button>
  <button class="tab" data-view="storage">Storage</button>
  <button class="tab" data-view="links">Links</button>
</nav>

<main>
  <section id="view-about" class="view active">
    <div class="index-card wide" id="aboutCard">
      <div class="card-topline"><span class="call-number">REF—01</span><span class="card-date" id="aboutUpdated"></span></div>
      <div id="aboutBody" class="about-body">
        <p class="loading">불러오는 중…</p>
      </div>
    </div>
  </section>

  <section id="view-works" class="view">
    <div class="card-grid" id="worksGrid">
      <p class="loading">불러오는 중…</p>
    </div>
  </section>

  <section id="view-notices" class="view">
    <div class="ledger" id="noticesLedger">
      <p class="loading">불러오는 중…</p>
    </div>
  </section>

  <section id="view-links" class="view">
    <div class="link-index" id="linksIndex">
      <p class="loading">불러오는 중…</p>
    </div>
  </section>
</main>

<footer>
  <span class="stamp">FILED &amp; INDEXED</span>
</footer>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="旦那様の屋敷見学。トランシー邸のアーカイブ。">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-06BWCGZJMD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-06BWCGZJMD');
</script>
</head>
<body>
<!-- 나비 스크롤 바 -->
<img src="morpho.png" alt="" class="scroll-morpho" id="scrollMorpho">
<img src="hand.png" alt="" id="touchCursor" class="touch-cursor">
  
<header class="masthead">  
  <img src="corner.png" alt="menu" class="top-left-icon" id="menuTriggerIcon">
  <h1 id="siteName">Web Retreat</h1>
</header>

<nav class="dropdown-menu" id="dropdownMenu">
  <button class="tab-link" data-view="pages">寝室</button>
  <button class="tab-link" data-view="profile">執務室</button>  
  <button class="tab-link" data-view="guestbook">応接間</button>
  <button class="tab-link" data-view="reader">書斎</button>
  <button class="tab-link" data-view="gallery">畵廊</button>
  <button class="tab-link active" data-view="main">玄関</button>
  <button class="tab-link" data-view="links">馬車</button>
</nav>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<main>
  <section id="view-main" class="view active">
    <div class="door-image" id="doorImage"></div>
      <h3 class="typeline-heading">Updates</h3>
    <div class="typeline" id="noticestypeline"></div>
  </section>
  
  <section id="view-profile" class="view">
    <div id="profileSections"></div>
  </section>

  <section id="view-gallery" class="view">
    <div class="card-grid" id="galleryGrid">
    </div>
  </section>

  <section id="view-links" class="view">
    <div class="link-index" id="linksIndex"></div>
  </section>

  <section id="view-pages" class="view">
  <div class="typeline" id="pagesList"></div>
  </section>
  
  <section id="view-reader" class="view">
  <div class="typeline" id="readerList"></div>

  <div id="readerViewerBox" style="display:none">
    <button class="back-link" id="readerBack">← リスト</button>

    <div id="reader-wrapper" class="index-card wide">
      <div id="reader-end-modal-overlay">
        <div id="reader-end-modal-content">
          <p id="reader-end-modal-msg">&nbsp;</p>
          <button id="reader-restart-btn">戻る</button>
        </div>
      </div>

      <div id="reader-viewer-container">
        <div id="reader-touch-left" class="reader-touch-zone">&nbsp;</div>
        <div id="reader-touch-right" class="reader-touch-zone">&nbsp;</div>

        <div id="reader-viewer">
          <div id="reader-viewer-content">&nbsp;</div>
          <div id="reader-loading-container">
            <div id="reader-loading-text">読み込み中...</div>
          </div>
        </div>
      </div>

      <div id="reader-footer-controls">
        <div id="reader-slider-container">
          <div id="reader-slider-tooltip">&nbsp;</div>
          <input id="reader-progress-slider" disabled max="1000" min="0" type="range" value="0">
        </div>
        <div id="reader-button-container">
          <button id="reader-prev-btn" class="reader-nav-btn">◀</button>
          <button id="reader-next-btn" class="reader-nav-btn">▶</button>
        </div>
      </div>
    </div>
  </div>
  </section>
  
  <section id="view-guestbook" class="view">
  <form id="guestbookForm" class="guestbook-form">
    <input type="text" id="gbName" placeholder="Name" maxlength="40" required>
    <textarea id="gbMessage" placeholder="Leave a message here" maxlength="500" rows="3" required></textarea>
    <button type="submit">Done</button>
  </form>
  <div class="typeline" id="guestbookList"></div>
  </section> 
</main>

<div id="lp-widget" class="lp-expanded" style="opacity: 0; visibility: hidden; transition: none;">
    <div id="lp-modal">
        <div class="lp-modal-header">
            PLAYLIST
            <button id="lp-modal-close" title="닫기">×</button>
        </div>
        <ul id="lp-modal-items"></ul>
    </div>
    <div id="lp-yt-container"><div id="lp-yt-player"></div></div>
    <div id="lp-deck">
        <div class="lp-record-area">
        
<div class="lp-vinyl">
    <div class="lp-label"></div> 
</div>
            <div class="lp-spindle"></div>
            <div class="lp-tooltip">Loading...</div>
        </div>
        <div class="lp-controls">
            <div class="lp-volume-wrap" title="음량 조절">       
                 <div class="lp-vol-rail">
                    <div class="lp-vol-fill" id="lp-vol-fill-sync"></div>
                    <div class="lp-vol-handle" id="lp-vol-handle-sync"></div>
                </div>
                <div class="lp-vol-hitbox"></div>
            </div>
 
            <div class="lp-tonearm">
                <div class="lp-part-pivot"></div> 
                <div class="lp-part-rod"></div> 
                <div class="lp-part-neck"></div> 
                <div class="lp-part-weight"></div>
                <div 
 class="lp-part-head"></div> 
            </div>
            <div class="lp-btn-group">
                <svg id="lp-led" viewBox="0 0 24 24" title="재생 중 알림">
                    <path d="M12,2 L14.5,9.5 L22,12 L14.5,14.5 L12,22 L9.5,14.5 L2,12 L9.5,9.5 Z"></path>
                </svg>
     
            <button id="lp-play-btn" title="プレイ">&#9654;</button>
                <button id="lp-close-btn" title="折る">&minus;</button>
            </div>
        </div>
    </div>
</div>
<button id="lp-expand-btn" title="플레이어 열기">&#9836;</button>

<div class="floating-ticket">
        <div class="ticket-inner">
            <!-- 1. 메인 구역 -->
            <div class="ticket-main">
                <span class="dday-title">いろんな所を<br>旅してから</span>
            </div>
            
            <!-- 2. DAYS 세로 라벨 구역 -->
            <div class="ticket-days">
                <span class="dday-label">DAYS</span>
            </div>

            <!-- 3. 자동 계산되는 숫자 구역 -->
            <div class="ticket-stub">
                <span class="dday-number" id="dday-count"></span>
            </div>
        </div>
    </div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>

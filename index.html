<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <h1 id="siteName">이름</h1>
</header>

<nav class="tabs">
  <button class="tab active" data-view="main">Main</button>
  <button class="tab" data-view="profile">Profile</button>
  <button class="tab" data-view="storage">Storage</button>
  <button class="tab" data-view="links">Links</button>
</nav>

<main>
  <section id="view-main" class="view active">
    <div class="hero-image" id="heroImage"></div>
    <div class="ledger" id="noticesLedger">
    </div>
  </section>

  <section id="view-profile" class="view">
    <div class="index-card wide" id="profileCard">
      <dl class="about-kv-list" id="profileBody">
      </dl>
    </div>
  </section>

  <section id="view-storage" class="view">
    <div class="card-grid" id="storageGrid">
    </div>
  </section>

  <section id="view-links" class="view">
    <div class="link-index" id="linksIndex">
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>

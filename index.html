<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<header class="masthead">
  <h1 id="siteName">hoheo taralna, rondero tarel</h1>
</header>

<nav class="tabs">
  <button class="tab active" data-view="main">Main</button>
  <button class="tab" data-view="profile">Profile</button>
  <button class="tab" data-view="storage">Storage</button>
  <button class="tab" data-view="pages">Pages</button>
  <button class="tab" data-view="links">Links</button>
  <button class="tab" data-view="guestbook">Guestbook</button>
</nav>

<main>
  <section id="view-main" class="view active">
    <div class="hero-image" id="heroImage"></div>
      <p class="visit-counter" id="visitCounter"></p>
      <h3 class="ledger-heading">Updates</h3>
    <div class="ledger" id="noticesLedger"></div>
  </section>
  
  <section id="view-profile" class="view">
    <div id="profileSections"></div>
  </section>

  <section id="view-storage" class="view">
    <div class="card-grid" id="storageGrid">
    </div>
  </section>

  <section id="view-links" class="view">
    <div class="link-index" id="linksIndex"></div>
  </section>

  <section id="view-pages" class="view">
    <div class="ledger" id="pagesList"></div>
  </section>

  <section id="view-guestbook" class="view">
  <form id="guestbookForm" class="guestbook-form">
    <input type="text" id="gbName" placeholder="Name" maxlength="40" required>
    <textarea id="gbMessage" placeholder="Leave a message here" maxlength="500" rows="3" required></textarea>
    <button type="submit">Done</button>
  </form>
  <div class="ledger" id="guestbookList"></div>
  </section> 
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기">☰</button>
  <h1 id="siteName">Web Retreat</h1>
</header>

<aside class="site-header-drawer" id="siteDrawer">
  <nav class="site-header-drawer-nav">
    <button class="tab-link active" data-view="main">Main</button>
    <button class="tab-link" data-view="profile">Profile</button>
    <button class="tab-link" data-view="storage">Storage</button>
    <button class="tab-link" data-view="pages">Pages</button>
    <button class="tab-link" data-view="links">Links</button>
    <button class="tab-link" data-view="guestbook">Guestbook</button>
  </nav>
</aside>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<main>
  <section id="view-main" class="view active">
    <div class="hero-image" id="heroImage"></div>
      <h3 class="ledger-heading">Updates</h3>
    <div class="ledger" id="noticesLedger"></div>
    <h3>
      <span class="ledger-heading">New</span>
    </h3>
  <div class="ledger" id="recentPostsList"></div>
  <p class="visit-counter" align=right id="visitCounter"></p>
  </section>
  
  <section id="view-profile" class="view">
    <div id="profileSections"></div>
  </section>

  <section id="view-storage" class="view">
    <div class="card-grid" id="storageGrid">
    </div>
  </section>

  <section id="view-links" class="view">
    <div class="link-index" id="linksIndex"></div>
  </section>

  <section id="view-pages" class="view">
  <div class="ledger" id="pagesList">
    <iframe 
      src="/topping/blog/" 
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
      style="width:100%; height:80vh; border:none;">
    </iframe>
  </div>
  </section>
  
  <section id="view-guestbook" class="view">
  <form id="guestbookForm" class="guestbook-form">
    <input type="text" id="gbName" placeholder="Name" maxlength="40" required>
    <textarea id="gbMessage" placeholder="Leave a message here" maxlength="500" rows="3" required></textarea>
    <button type="submit">Done</button>
  </form>
  <div class="ledger" id="guestbookList"></div>
  </section> 
</main>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>

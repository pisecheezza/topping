<header class="masthead">
  <button class="menu-toggle" id="menuToggle" aria-label="open menu">☰</button>
  <h1 id="siteName">{{ site.title }}</h1>
</header>

<aside class="site-header-drawer" id="siteDrawer">
  <nav class="site-header-drawer-nav">
    <a class="tab-link" href="/">Main</a>
    <a class="tab-link" href="/#profile">Profile</a>
    <a class="tab-link" href="/#storage">Storage</a>
    <a class="tab-link" href="/all">Pages</a>
    <a class="tab-link" href="/#links">Links</a>
    <a class="tab-link" href="/#guestbook">Guestbook</a>
  </nav>
</aside>

<div class="drawer-backdrop" id="drawerBackdrop"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const drawer = document.getElementById("siteDrawer");
    const backdrop = document.getElementById("drawerBackdrop");
    const menuToggle = document.getElementById("menuToggle");

    function openDrawer() { drawer.classList.add("open"); backdrop.classList.add("show"); }
    function closeDrawer() { drawer.classList.remove("open"); backdrop.classList.remove("show"); }

    menuToggle.addEventListener("click", () => {
      drawer.classList.contains("open") ? closeDrawer() : openDrawer();
    });
    backdrop.addEventListener("click", closeDrawer);
  });
</script>

---
layout: default
title: Blog
permalink: /blog/
---

<a href="{{ '/categories/' | relative_url }}" style="display:inline-block; margin-bottom:16px;">Show Categories→</a>

<div id="pagesList">loading...</div>

<style>
#pagesList { font-family: "Tahoma", "Malgun Gothic", "Hiragino Kaku Gothic ProN", sans-serif; }
#pagesList .ledger-row { display:flex; align-items:flex-start; gap:16px; padding:16px 4px; border-bottom:1px solid var(--ink, #222); }
#pagesList .ledger-date { width:90px; flex-shrink:0; font-size:12px; }
#pagesList a { text-decoration:none; color:inherit; font-weight:600; }
</style>

<script>
function formatDateDot(d){ return String(d||"").replace(/-/g,"."); }
fetch("{{ '/posts.json' | relative_url }}", { cache: "no-store" })
  .then(res => res.json())
  .then(posts => {
    const list = document.getElementById("pagesList");
    list.innerHTML = "";
    posts
      .sort((a,b) => b.date.localeCompare(a.date))
      .forEach(p => {
        const row = document.createElement("div");
        row.className = "ledger-row";
        row.innerHTML = `
          <div class="ledger-date">${formatDateDot(p.date)}</div>
          <div><a href="${p.url}">${p.category ? "["+p.category+"] " : ""}${p.title}</a></div>`;
        list.appendChild(row);
      });
  });
</script>
